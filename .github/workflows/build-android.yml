name: Build Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'Savvy-Mobile-Source.zip'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Restore complete project from source ZIP
        run: |
          python3 - <<'SOURCE'
          import os, pathlib, zipfile
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'savvy-source'
          destination.mkdir(exist_ok=True)
          with zipfile.ZipFile('Savvy-Mobile-Source.zip') as source:
              for member in source.infolist():
                  target = (destination / member.filename).resolve()
                  if not target.is_relative_to(destination.resolve()):
                      raise SystemExit('Unsafe ZIP path')
              source.extractall(destination)
          project = destination / 'Savvy-Wedding-Planner-Mobile'
          for required in ['package.json', 'package-lock.json', 'android/gradlew', 'android/settings.gradle', 'src/main.tsx']:
              if not (project / required).is_file():
                  raise SystemExit(f'Source ZIP is missing {required}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'APP_DIR={project}\n')
          SOURCE
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build app and synchronize Android
        run: |
          cd "$APP_DIR"
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Compile installable test APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: Savvy-Android-Test-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
